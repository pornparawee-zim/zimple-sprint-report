name: Archive Sprint Report

on:
  push:
    branches: [main]
    paths: [index.html]

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if _updated changed
        id: check
        run: |
          CURRENT=$(grep -o '"_updated":[[:space:]]*"[^"]*"' index.html | grep -o '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}' | head -1)
          
          # ถ้าไม่มี HEAD~1 (commit แรก) ให้ถือว่าไม่ archive
          PREVIOUS=$(git show HEAD~1:index.html 2>/dev/null | grep -o '"_updated":[[:space:]]*"[^"]*"' | grep -o '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}' | head -1) || PREVIOUS="none"
          
          echo "Current: $CURRENT"
          echo "Previous: $PREVIOUS"
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

          if [ -z "$CURRENT" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          elif [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Archive report
        if: steps.check.outputs.changed == 'true'
        run: |
          DATE="${{ steps.check.outputs.current }}"
          cp index.html "report-${DATE}.html"
          echo "Archived as: report-${DATE}.html"

      - name: Commit archive
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "report-${{ steps.check.outputs.current }}.html"
          git commit -m "Archive: report-${{ steps.check.outputs.current }}.html"
          git push
