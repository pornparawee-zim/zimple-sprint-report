<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zimple Sprint Effort Summary</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{--bg:#f4f6fb;--surface:#ffffff;--card:#f8fafc;--border:#dde3f0;--accent:#3b6fd4;--accent2:#6040b8;--green:#1e9e6e;--yellow:#c77c00;--red:#d63e4a;--orange:#c26000;--muted:#8892b0;--textdim:#4a5568;--text:#1a1f36;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans Thai',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;min-height:100vh}
/* Header */
.topbar{background:#ffffff;border-bottom:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.06);padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.edit-badge{background:var(--accent2);color:#fff;border-radius:5px;padding:4px 12px;font-size:11px;cursor:pointer;font-weight:500;border:none;font-family:var(--sans)}
.edit-hint{font-size:10px;color:#8892b0;margin-left:auto}
/* Date badge */
.date-badge{background:rgba(91,141,238,.12);color:var(--accent);border:1px solid rgba(91,141,238,.2);border-radius:5px;padding:3px 10px;font-size:11px;font-family:var(--mono)}
/* Main */
main{max-width:980px;margin:0 auto;padding:28px 20px}
/* Title */
.title-block{margin-bottom:20px}
.title-block h1{font-size:26px;font-weight:600;margin-bottom:6px}
.title-block h1 span{color:var(--accent)}
.title-block .subtitle{font-size:13px;color:var(--textdim);margin-bottom:10px}
.product-tags{display:flex;gap:8px;flex-wrap:wrap}
.ptag{border:1px solid;border-radius:5px;padding:3px 10px;font-size:11px}
.ptag-omni{border-color:rgba(91,141,238,.4);color:var(--accent)}
.ptag-ai{border-color:rgba(232,121,249,.4);color:#7c35b8}
.ptag-commerce{border-color:rgba(245,166,35,.4);color:var(--yellow)}
.ptag-team{border-color:var(--border);color:var(--textdim)}
/* KPI cards */
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.kpi-card{background:#ffffff;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.04);border-radius:10px;padding:18px 20px}
.kpi-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px}
.kpi-val{font-size:32px;font-weight:700;font-family:var(--mono);margin-bottom:4px}
.kpi-sub{font-size:11px;color:var(--textdim)}
/* Sprint overview */
.section-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:10px}
.cycles-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.cycle-card{background:#ffffff;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04);border-radius:10px;padding:14px}
.cycle-title{font-size:10px;color:var(--muted);margin-bottom:8px}
.sprint-item{margin-bottom:8px}
.sprint-name{font-size:14px;font-weight:600;color:var(--accent)}
.sprint-sp{font-family:var(--mono);font-size:14px;font-weight:700;float:right}
.sprint-sp.ai{color:#7c35b8}
.sprint-sp.omni{color:var(--accent)}
.sprint-desc{font-size:11px;color:var(--textdim);margin-top:2px;clear:both}
.sprint-dates{font-size:10px;color:var(--muted);margin-top:2px}
.sprint-empty{font-size:11px;color:var(--muted);font-style:italic;margin-top:6px}
.sprint-divider{border:none;border-top:1px solid var(--border);margin:8px 0}
/* Workload section */
.workload-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.collapse-btn{background:var(--card);border:1px solid var(--border);border-radius:5px;padding:4px 10px;font-size:11px;cursor:pointer;color:var(--textdim);font-family:var(--sans)}
.legend-right{margin-left:auto;display:flex;gap:12px;font-size:10px;color:var(--textdim);align-items:center}
.leg-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
/* Workload bars */
.workload-wrap{background:#ffffff;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.04);border-radius:10px;padding:16px;margin-bottom:20px}
.member-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.member-avatar{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
.member-name{width:52px;font-size:12px;flex-shrink:0}
.bar-wrap{flex:1;position:relative}
.bar-bg{height:20px;border-radius:4px;overflow:hidden;display:flex}
.bar-omni{background:var(--accent);height:100%;display:flex;align-items:center;padding:0 6px;font-size:10px;color:rgba(255,255,255,.95);font-family:var(--mono);white-space:nowrap;min-width:0}
.bar-ai{background:#8b44cc;height:100%;display:flex;align-items:center;padding:0 6px;font-size:10px;color:rgba(255,255,255,.95);font-family:var(--mono);white-space:nowrap;min-width:0}
.bar-right{font-size:11px;color:var(--textdim);white-space:nowrap;font-family:var(--mono);min-width:140px;text-align:right}
/* Detail table */
.detail-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.table-wrap{background:#ffffff;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.04);border-radius:10px;overflow:hidden;margin-bottom:20px}
table{width:100%;border-collapse:collapse}
th{background:rgba(59,111,212,.06);padding:8px 12px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
th,td{text-align:right}
th:first-child,td:first-child{text-align:left}
td{padding:9px 12px;border-bottom:1px solid rgba(42,48,72,.35);font-size:12px}
tr:last-child td{border-bottom:none}
td.num{font-family:var(--mono)}
.avg-col{color:var(--accent);font-weight:600;font-family:var(--mono)}
.avg-ai{color:#7c35b8}
.member-cell{display:flex;align-items:center;gap:8px}
.m-avatar{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;flex-shrink:0}
.pct-col{color:var(--textdim);font-family:var(--mono)}
.note-col{font-size:11px;color:var(--textdim)}
.note-col .hi{color:var(--red);font-size:10px}
.total-row td{background:rgba(59,111,212,.08);font-weight:700;border-top:2px solid var(--border)!important}
/* Bottom summary */
.bottom-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.sum-card{background:#ffffff;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04);border-radius:10px;padding:16px 18px}
.sum-label{font-size:11px;color:var(--muted);margin-bottom:6px}
.sum-val{font-size:28px;font-weight:700;font-family:var(--mono);margin-bottom:4px}
.sum-val.omni{color:var(--accent)}
.sum-val.ai{color:#7c35b8}
.sum-val.total{color:var(--text)}
.sum-sub{font-size:11px;color:var(--textdim)}
/* Warning box */
.warn-box{background:rgba(199,124,0,.05);border:1px solid rgba(199,124,0,.2);border-radius:8px;padding:12px 14px;margin-bottom:10px;font-size:11px;color:var(--textdim)}
.warn-box strong{color:var(--yellow)}
/* Footnotes */
.fn-list{list-style:none;padding:0;font-size:10px;color:var(--muted)}
.fn-list li::before{content:'* '}
/* Toast */
#toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:#0a1f0d;padding:8px 16px;border-radius:6px;font-size:12px;font-weight:600;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none}

/* ── Edit Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-box{background:#fff;border-radius:12px;width:100%;max-width:700px;box-shadow:0 8px 40px rgba(0,0,0,.15);overflow:hidden;margin:auto}
.modal-header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:14px;font-weight:600;flex:1}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:4px}
.modal-close:hover{background:var(--bg)}
.modal-body{padding:20px;max-height:70vh;overflow-y:auto}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:#fff}
.ms-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.m-cycle-block{background:var(--bg);border-radius:8px;padding:12px;margin-bottom:10px}
.m-cycle-label{font-size:11px;color:var(--muted);margin-bottom:8px;font-weight:600}
.m-field-row{display:flex;gap:8px;margin-bottom:6px}
.m-field{display:flex;flex-direction:column;gap:3px;flex:1}
.m-field-sm{max-width:110px}
.m-field label{font-size:10px;color:var(--muted);font-weight:600}
.m-field input,.m-field textarea{background:#fff;border:1px solid var(--border);color:var(--text);border-radius:5px;padding:5px 8px;font-size:12px;font-family:var(--sans);width:100%}
.m-field input:focus,.m-field textarea:focus{outline:none;border-color:var(--accent)}
.m-textarea{width:100%;background:#fff;border:1px solid var(--border);border-radius:6px;padding:8px;font-size:12px;font-family:var(--sans);color:var(--text);resize:vertical;min-height:56px}
.m-member-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:10px}
.m-member-name{font-size:12px;font-weight:600;width:52px;flex-shrink:0;padding-bottom:8px}
.m-fn-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.m-fn-row input{flex:1;background:#fff;border:1px solid var(--border);color:var(--text);border-radius:5px;padding:5px 8px;font-size:12px;font-family:var(--sans)}
.m-fn-del{background:rgba(214,62,74,.08);color:var(--red);border:1px solid rgba(214,62,74,.2);border-radius:4px;padding:4px 8px;font-size:11px;cursor:pointer}
.m-fn-add{background:rgba(59,111,212,.06);color:var(--accent);border:1px solid rgba(59,111,212,.2);border-radius:5px;padding:5px 12px;font-size:11px;cursor:pointer;margin-top:4px}
.btn-cancel{background:var(--bg);color:var(--textdim);border:1px solid var(--border);border-radius:6px;padding:7px 16px;font-size:12px;cursor:pointer;font-family:var(--sans)}
.btn-save{background:var(--accent2);color:#fff;border:none;border-radius:6px;padding:7px 18px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.btn-save:hover{opacity:.9}

/* KPI Collapsible */
.kpi-collapsible{margin-bottom:8px}
.kpi-sec-btn{width:100%;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;font-family:var(--sans);text-align:left;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.kpi-sec-btn:hover{border-color:var(--accent);background:rgba(59,111,212,.02)}
.kpi-sec-body{padding:12px 0 4px}

/* ── Responsive ── */
@media(max-width:768px){
  main{padding:16px 12px}
  .title-block h1{font-size:20px}
  .kpi-row{grid-template-columns:1fr 1fr}
  .kpi-val{font-size:24px}
  .cycles-grid{grid-template-columns:1fr}
  .bottom-grid{grid-template-columns:1fr}
  .sum-val{font-size:22px}
  .bar-right{min-width:100px;font-size:10px}
  .member-name{width:40px;font-size:11px}
  .table-wrap{overflow-x:auto}
  table{min-width:600px}
  .modal-body{max-height:60vh}
  .m-field-row{flex-wrap:wrap}
  .m-field-sm{max-width:100%}
  .topbar{padding:8px 12px;gap:8px}
  .edit-hint{display:none}
}

@media(max-width:480px){
  .kpi-row{grid-template-columns:1fr}
  .kpi-val{font-size:28px}
  .title-block h1{font-size:18px}
  .legend-right{display:none}
  .bar-right{min-width:80px;font-size:9px}
  main{padding:12px 10px}
}
</style>
</head>
<body>

<div class="topbar" style="background:#fff">
  <span style="font-size:11px;font-weight:600;color:#8892b0;text-transform:uppercase;letter-spacing:.5px">EDIT</span>
  <button class="edit-badge" id="edit-btn" onclick="toggleEdit()">📊 แก้ไขข้อมูล</button>
  <span class="edit-hint" id="edit-hint">กด 'แก้ไขข้อมูล' เพื่อแก้ไขและบันทึกการเปลี่ยนแปลง</span>
  <span class="date-badge" id="date-badge">—</span>
</div>

<main>
  <div id="root"></div>
</main>

<div id="toast"></div>

<script>
/* ═══════════════════════════════════
   CONFIG & DATA
═══════════════════════════════════ */
const SUPA_URL = 'https://qabbwvmazpdyjdjcvhrm.supabase.co';
const SUPA_KEY = 'sb_publishable_18mSYWVH7Pcp5OaIwjQ7LQ_TtWWz_nj';

const INIT_DATA = {
  _updated: '2026-07-03T12:00:00',

    },
    {

      commerce: null
    },
    {
      label: 'รอบที่ 3',
      omni: {name:'Sprint 8', sp:38.5, desc:'Rule Automation + Mylogiz integrations', dates:'22 Jun 26 – 3 Jul 26'},
      ai:   {name:'Sprint 4', sp:0, desc:'ยังไม่มีข้อมูล', dates:''},
      commerce: null
    }
  ],
  omni: {
    sprints: [
      {name:'Sprint 6', sp:{Q:17,Griang:21,Toy:13,Wick:8,Tan:3}},
      {name:'Sprint 7', sp:{Griang:21,Toy:18,Q:17,Top:0}},
      {name:'Sprint 8', sp:{Wick:16,Griang:9,Q:7,Toy:6.5}}
    ]
  },
  ai: {
    sprints: [
      {name:'Sprint 2', sp:{Wick:30,Toy:1,Q:1,Top:1,Tan:1,Griang:1}},
      {name:'Sprint 3', sp:{Wick:36}},
      {name:'Sprint 4', sp:{}}
    ]
  },
  sprint_notes: {'Omni : Sprint 8': 'A4.1(1)-->ui ยังไม่เสร็จ /A4.1(4)--> SP5', 'AI : Sprint 4': 'ไม่ได้ดึง task AI มาทำ/เอาไปทำ sp5 แทน'},
  warnings: ['ตัวเลข SP ข้างต้นไม่รวม effort ในการแก้ defect — actual effort จริงของทีมอาจสูงกว่านี้'],
  omniAllTime: [
    {name:'SP1', sp:76, desc:'Program Setup + Channel Connectivity', dates:'16 Feb 26 – 6 Mar 26'},
    {name:'SP2', sp:98, desc:'Channel Connectivity + Unified Inbox', dates:'9 Mar 26 – 23 Mar 26'},
    {name:'SP3', sp:84, desc:'Unified Inbox + Agent Workflow + Contact Profile', dates:'26 Mar 26 – 30 Apr 26'},
    {name:'SP4', sp:60, desc:'RBAC + Settings & Configuration', dates:'16 Feb 26 – 1 Mar 26'},
    {name:'SP5', sp:24, desc:'Login Security (มีวันหยุดยาว)', dates:'2 Mar 26 – 15 Mar 26'},
    {name:'SP6', sp:62, desc:'Login Security + SLA Management', dates:'16 Mar 26 – 29 Mar 26'},
    {name:'SP7', sp:56, desc:'Notification Center', dates:'8 Jun 26 – 19 Jun 26'},
    {name:'Sprint 8', sp:38.5, desc:'Rule Automation + Mylogiz integrations', dates:'22 Jun 26 – 3 Jul 26'}
  ],
  aiAllTime: [
    {name:'Sprint 1', sp:26, desc:'Knowledge Ingestion + Program Setup', dates:'5 May 26 – 18 May 26'},
    {name:'Sprint 2', sp:35, desc:'Vault Injection + Auth + Sign Up + Login + Workspace', dates:'18 May 26 – 6 Jun 26'},
    {name:'Sprint 3', sp:36, desc:'KI-01–04: Multi-tenant + KB + Agent + Monitoring', dates:'8 Jun 26 – 19 Jun 26'}
  ],
  footnotes: [
    'tasks ที่มีหลาย owner: split SP เท่ากันทุกคน',
    'Top ออกจาก report ตั้งแต่ Sprint 7 เป็นต้นไป (ย้ายไป project นอกเต็มตัว)'
  ]
};

let DATA = JSON.parse(JSON.stringify(INIT_DATA));
let editMode = false;
// Toggle state — persistent across render()
const kpiState = {
  'kpi-last': true,   // SP sprint ล่าสุด — default open
  'kpi-avg':  true,   // เฉลี่ย 3 sprint ล่าสุด
  'kpi-all':  false,  // SP รวมทั้งหมด
  'workload': true,   // Workload
  'detail':   true    // ตารางละเอียด
};

function toggleKpi(id){
  kpiState[id] = !kpiState[id];
  const el = document.getElementById(id+'-body');
  const arrow = document.getElementById(id+'-arrow');
  if(el) el.style.display = kpiState[id] ? 'block' : 'none';
  if(arrow) arrow.style.transform = kpiState[id] ? 'rotate(180deg)' : 'rotate(0deg)';
}

/* ── Supabase ── */
async function loadData(){
  try {
    const r = await fetch(`${SUPA_URL}/rest/v1/sprint_report?id=eq.current&select=data`,{
      headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`}
    });
    if(r.ok){
      const rows = await r.json();
      if(rows.length && rows[0].data){
        const saved = rows[0].data;

        // Start fresh from INIT_DATA
        DATA = JSON.parse(JSON.stringify(INIT_DATA));

        // If Supabase sp_data is newer → use it for SP data
        if(saved.sp_data && saved.sp_data._updated > INIT_DATA._updated){
          Object.assign(DATA, saved.sp_data);
          DATA._updated = saved.sp_data._updated;
        }

        // Always merge annotations
        if(saved.annotations){
          const ann = saved.annotations;
          if(ann.notes)        DATA.notes        = Object.assign({}, INIT_DATA.notes, ann.notes);
          if(ann.sprint_notes) DATA.sprint_notes = ann.sprint_notes;
          if(ann.sprint_dates) DATA.sprint_dates = ann.sprint_dates;
          if(ann.warnings)     DATA.warnings     = ann.warnings;
          if(ann.footnotes)    DATA.footnotes    = ann.footnotes;
        }

        // Legacy flat structure support — override if INIT_DATA is newer
        if(!saved.sp_data && !saved.annotations && saved.omni){
          // DATA already set to INIT_DATA above — keep it if newer
          // Only merge user annotations from legacy
          if(saved.notes)     DATA.notes     = Object.assign({}, INIT_DATA.notes, saved.notes);
          if(saved.warnings)  DATA.warnings  = saved.warnings;
          if(saved.footnotes) DATA.footnotes = saved.footnotes;
          // If legacy _updated is newer than INIT_DATA → use legacy sp data
          if(saved._updated && saved._updated > INIT_DATA._updated){
            Object.assign(DATA, saved);
            DATA.notes     = Object.assign({}, INIT_DATA.notes, saved.notes||{});
            DATA.warnings  = saved.warnings  || INIT_DATA.warnings;
            DATA.footnotes = saved.footnotes || INIT_DATA.footnotes;
          }
        }
      }
    }
  } catch(e){ console.warn('loadData error:', e); }
  try { render(); } catch(e){ console.error('render error:', e); }
}

async function saveData(){
  const payload = {
    sp_data: {
      _updated: DATA._updated,
      subtitle: DATA.subtitle,
      members: DATA.members,
      colors: DATA.colors,
      avatarBg: DATA.avatarBg,
      cycles: DATA.cycles,
      omni: DATA.omni,
      ai: DATA.ai,
      omniAllTime: DATA.omniAllTime,
      aiAllTime: DATA.aiAllTime
    },
    annotations: {
      notes:        DATA.notes        || {},
      sprint_notes: DATA.sprint_notes || {},
      sprint_dates: DATA.sprint_dates || {},
      warnings:     DATA.warnings     || [],
      footnotes:    DATA.footnotes    || []
    }
  };
  try {
    await fetch(`${SUPA_URL}/rest/v1/sprint_report?id=eq.current`,{
      method:'PATCH',
      headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({data:payload})
    });
    showToast('💾 บันทึกแล้ว');
  } catch(e){ showToast('❌ บันทึกไม่สำเร็จ'); }

}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.opacity=1;
  setTimeout(()=>t.style.opacity=0,2200);
}

/* ══════════════════════════════════
   COMPUTE
══════════════════════════════════ */
function compute(){
  const members = DATA.members;
  const omniTotals={}, aiTotals={};
  members.forEach(m=>{ omniTotals[m]=0; aiTotals[m]=0; });

  DATA.omni.sprints.forEach(s=>members.forEach(m=>{ omniTotals[m]+=(s.sp[m]||0); }));
  DATA.ai.sprints.forEach(s=>members.forEach(m=>{ aiTotals[m]+=(s.sp[m]||0); }));

  const omniAvg={}, aiAvg={};
  members.forEach(m=>{ omniAvg[m]=Math.round(omniTotals[m]/3*100)/100; aiAvg[m]=Math.round(aiTotals[m]/3*100)/100; });

  // All-time totals
  const totalSP = {
    omni: (DATA.omniAllTime||[]).reduce((a,s)=>a+(typeof s.sp==='number'?s.sp:Object.values(s.sp).reduce((x,y)=>x+y,0)),0),
    ai:   (DATA.aiAllTime||[]).reduce((a,s)=>a+(typeof s.sp==='number'?s.sp:Object.values(s.sp).reduce((x,y)=>x+y,0)),0)
  };
  totalSP.all = totalSP.omni + totalSP.ai;
  // Max sprint SP (for reference)
  const maxOmniSP = Math.max(...(DATA.omniAllTime||[]).map(s=>typeof s.sp==='number'?s.sp:Object.values(s.sp).reduce((x,y)=>x+y,0)));
  const cycles = DATA.omni.sprints.length; // 3

  const memberTotals={};
  members.forEach(m=>{ memberTotals[m]={omni:omniTotals[m],ai:aiTotals[m],total:omniTotals[m]+aiTotals[m]}; });

  return {members,omniTotals,aiTotals,omniAvg,aiAvg,totalSP,cycles,memberTotals};
}

      <span><span class="leg-dot" style="background:var(--accent)"></span>Omni</span>
      <span><span class="leg-dot" style="background:#8b44cc"></span>AI</span>
      <span style="margin-left:8px;color:var(--muted)">SP รวม | เฉลี่ย/cycle</span>
    </div>
  </div>`;

  h += `<div id="workload-body" style="${kpiState['workload']?'':' display:none'}">`;
  h += `<div class="workload-wrap">`;
    // Show Top if they have any SP in current sprints
    const allMembers = [...members];
    const topOmni = DATA.omni.sprints.reduce((a,s)=>a+(s.sp['Top']||0),0);
    const topAI   = DATA.ai.sprints.reduce((a,s)=>a+(s.sp['Top']||0),0);
    if((topOmni+topAI)>0 && !allMembers.includes('Top')) allMembers.push('Top');
    allMembers.forEach(m=>{
      const mOmni = DATA.omni.sprints.reduce((a,s)=>a+(s.sp[m]||0),0);
      const mAI   = DATA.ai.sprints.reduce((a,s)=>a+(s.sp[m]||0),0);
      const tot = mOmni + mAI;
      if(!tot) return;
      const omniW = maxBar ? mOmni/maxBar*100 : 0;
      const aiW   = maxBar ? mAI/maxBar*100 : 0;
      const avg   = Math.round(tot/3*100)/100;
      const initials = m.slice(0,2);
      h += `<div class="member-row">
        <div class="member-avatar" style="background:${DATA.avatarBg[m]||'rgba(91,141,238,.15)'}">
          <span style="color:${DATA.colors[m]||'var(--accent)'};">${initials}</span>
        </div>
        <div class="member-name">${m}</div>
        <div class="bar-wrap">
          <div class="bar-bg">
            ${mOmni>0?`<div class="bar-omni" style="width:${omniW}%">${mOmni}</div>`:''}
            ${mAI>0?`<div class="bar-ai" style="width:${aiW}%">${mAI}</div>`:''}
          </div>
        </div>
        <div class="bar-right">${tot} SP &nbsp;|&nbsp; <span style="color:#92400e;font-weight:600">${avg} avg SP/sprint <span style="font-weight:400;font-size:10px">(÷3)</span></span></div>
      </div>`;
    });
  h += `</div>`;
  h += `</div>`;

  // Detail table
  h += `<div class="detail-header">
    <button class="collapse-btn" onclick="toggleKpi('detail')">ตารางละเอียด <span id="detail-arrow" style="font-size:.75rem;display:inline-block;transition:transform .2s">▼</span></button>
    <div class="legend-right">
      <span><span class="leg-dot" style="background:var(--accent)"></span>Omni</span>
      <span><span class="leg-dot" style="background:#8b44cc"></span>AI</span>
    </div>
  </div>`;

  h += `<div id="detail-body" style="${kpiState['detail']?'':' display:none'}">`;
  {
    const omniN = DATA.omni.sprints.length;
    const aiN = DATA.ai.sprints.length;
    h += `<div class="table-wrap"><table>
      <thead><tr>
        <th style="text-align:left">คน</th>
        <th>OMNI SP<br><span style="font-weight:400">(${omniN}sp)</span></th>
        <th>เฉลี่ย<br>OMNI/SP</th>
        <th style="color:#7c35b8">AI SP<br><span style="font-weight:400">(${aiN}sp)</span></th>
        <th style="color:#7c35b8">เฉลี่ย<br>AI/SP</th>
        <th>COMMERCE SP<br><span style="font-weight:400">(0sp)</span></th>
        <th>เฉลี่ย<br>COMMERCE/SP</th>
        <th>รวม SP</th>
        <th>เฉลี่ยรวม<br>/SP</th>
        <th>%</th>
        <th style="text-align:left">หมายเหตุ</th>
      </tr></thead>
      <tbody>`;

    members.forEach(m=>{
      const tot = memberTotals[m].total;
      const pct = totalAll ? Math.round(tot/totalAll*1000)/10 : 0;
      const note = (DATA.notes||{})[m]||'';
      const noteWarn = (DATA.warnings_member||{})[m]||'';
      h += `<tr>
        <td><div class="member-cell">
          <div class="m-avatar" style="background:${DATA.avatarBg[m]||'rgba(91,141,238,.15)'}">
            <span style="color:${DATA.colors[m]||'var(--accent)'}">${m.slice(0,2)}</span>
          </div>
          ${m}
        </div></td>
        <td class="num">${memberTotals[m].omni||0}</td>
        <td class="avg-col">${omniAvg[m]||0}</td>
        <td class="num" style="color:#7c35b8">${memberTotals[m].ai||0}</td>
        <td class="avg-ai">${aiAvg[m]||0}</td>
        <td class="num">0</td>
        <td class="num" style="color:var(--muted)">0</td>
        <td class="num" style="font-weight:700">${tot}</td>
        <td class="avg-col" style="color:#92400e;font-weight:600">${Math.round(tot/omniN*100)/100}</td>
        <td class="pct-col">${pct}%</td>
        <td class="note-col">${editMode?`<input style="background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--textdim);font-size:11px;width:100%" value="${note}" oninput="if(!DATA.notes)DATA.notes={};DATA.notes['${m}']=this.value">`:note}${noteWarn?`<div class="hi">${noteWarn}</div>`:''}</td>
      </tr>`;
    });

    // Total row
    const omniTotal = members.reduce((a,m)=>a+memberTotals[m].omni,0);
    const aiTotal   = members.reduce((a,m)=>a+memberTotals[m].ai,0);
    h += `<tr class="total-row">
      <td>รวม</td>
      <td class="num">${omniTotal}</td>
      <td class="avg-col">${Math.round(omniTotal/omniN*100)/100}</td>
      <td class="num" style="color:#7c35b8">${aiTotal}</td>
      <td class="avg-ai">${Math.round(aiTotal/aiN*100)/100}</td>
      <td class="num">0</td>
      <td class="num">0</td>
      <td class="num">${totalAll}</td>
      <td class="avg-col" style="color:#92400e;font-weight:600">${Math.round(totalAll/omniN*100)/100}</td>
      <td class="pct-col">100%</td>
      <td></td>
    </tr>`;

    h += `</tbody></table></div>`;
  }

  // Bottom summary — avg of last 3 sprints
  const omniAvgTotal = Math.round(totalSP.omni/DATA.omni.sprints.length*100)/100;
  const aiAvgTotal   = Math.round(totalSP.ai/DATA.ai.sprints.length*100)/100;
  const grandAvg     = Math.round((omniAvgTotal+aiAvgTotal)*10)/10;
  const coreOmni = members.filter(m=>memberTotals[m].omni>10).join('+');
  const coreAI   = members.filter(m=>memberTotals[m].ai>10).join('+');

  // bottom summary now in KPI section

  // Warnings
  DATA.warnings.forEach(w=>{
    h += `<div class="warn-box">⚠️ ${w}</div>`;
  });

  // Footnotes
  h += `<ul class="fn-list">`;
  DATA.footnotes.forEach(fn=>{ h += `<li>${fn}</li>`; });
  h += `</ul>`;

  h += `
    <div class="kpi-collapsible" style="margin-bottom:20px">
      <button class="kpi-sec-btn" onclick="toggleKpi('kpi-all')" style="border-left:4px solid #8892b0;background:rgba(136,146,176,.04)">
        📊 SP รวมทั้งหมดตั้งแต่เริ่มต้น
        <span id="kpi-all-arrow" style="margin-left:auto;font-size:.75rem;transition:transform .2s;display:inline-block;transform:${kpiState['kpi-all']?'rotate(180deg)':'rotate(0deg)'}">▼</span>
      </button>
      <div id="kpi-all-body" class="kpi-sec-body" style="${kpiState['kpi-all']?'':' display:none'}">
        <div class="kpi-row" style="grid-template-columns:repeat(4,1fr)">
          <div class="kpi-card" style="background:var(--bg)"><div class="kpi-label" style="color:var(--accent)">Omni รวม</div><div class="kpi-val" style="color:var(--accent);font-size:24px">${totalSP.omni}</div><div class="kpi-sub">${(DATA.omniAllTime||[]).length} sprints</div></div>
          <div class="kpi-card" style="background:var(--bg)"><div class="kpi-label" style="color:#7c35b8">AI รวม</div><div class="kpi-val" style="color:#7c35b8;font-size:24px">${totalSP.ai}</div><div class="kpi-sub">${(DATA.aiAllTime||[]).length} sprints</div></div>
          <div class="kpi-card" style="background:var(--bg)"><div class="kpi-label" style="color:var(--yellow)">Commerce รวม</div><div class="kpi-val" style="color:var(--yellow);font-size:24px">0</div><div class="kpi-sub">ยังไม่เริ่ม</div></div>
          <div class="kpi-card" style="background:var(--bg)"><div class="kpi-label">เฉลี่ยรวม / sprint</div><div class="kpi-val" style="font-size:24px">${Math.round(totalSP.all/(DATA.omniAllTime||[]).length*10)/10}</div><div class="kpi-sub">รวม ${totalSP.all} SP ÷ ${(DATA.omniAllTime||[]).length} sprints (อิงตามจำนวน sp ของ Omni)</div></div>
        </div>
      </div>
    </div>`;

  
  document.getElementById('root').innerHTML = h;
}

loadData();
</script>

<!-- Edit Modal -->
<div class="modal-overlay" id="edit-modal" onclick="if(event.target===this)closeEditModal()">
  <div class="modal-box">
    <div class="modal-header">
      <span>📊</span>
      <h2>แก้ไขข้อมูล Report</h2>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeEditModal()">ยกเลิก</button>
      <button class="btn-save" onclick="applyAndSave()">✓ บันทึกและ Render ใหม่</button>
    </div>
  </div>
</div>

</body>
</html>
