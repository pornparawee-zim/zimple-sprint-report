<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zimple Solution — Sprint Effort Summary</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --omni:#6C5CE7;--omni-light:#EEF0FF;--ai:#D63384;--ai-light:#FCE8F3;
    --text:#1a1a2e;--text-muted:#6b7280;--text-faint:#9ca3af;
    --bg:#f9f9fb;--surface:#fff;--border:#e5e7eb;--border-strong:#d1d5db;
    --warn-bg:#fffbeb;--warn-text:#92400e;--radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);padding:2rem 1.5rem}
  .page{max-width:980px;margin:0 auto}

  /* Toolbar */
  #toolbar{position:sticky;top:0;z-index:100;background:#1a1a2e;color:#fff;padding:.6rem 1.2rem;border-radius:var(--radius);margin-bottom:1.5rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,.18)}
  .tb-title{font-size:.72rem;color:#a5b4fc;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
  .tb-btn{padding:5px 14px;border-radius:6px;border:none;cursor:pointer;font-size:.75rem;font-weight:600;font-family:'DM Sans',sans-serif;transition:all .15s}
  .tb-edit{background:#6C5CE7;color:#fff}.tb-edit:hover{background:#5a4dd4}
  .tb-done{background:#10b981;color:#fff;display:none}.tb-done:hover{background:#059669}
  .tb-hint{font-size:.7rem;color:#64748b;margin-left:auto}
  .tb-badge{display:none;padding:3px 10px;border-radius:20px;background:#fef08a;color:#713f12;font-size:.7rem;font-weight:600}
  [contenteditable="true"]{outline:2px dashed #6C5CE7;border-radius:3px;padding:1px 3px;cursor:text;background:rgba(108,92,231,.05)}
  [contenteditable="true"]:focus{outline:2px solid #6C5CE7;background:rgba(108,92,231,.08)}

  /* Layout */
  .title{font-size:1.75rem;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin-bottom:.3rem}
  .title span{color:var(--omni)}
  .subtitle{font-size:.85rem;color:var(--text-muted)}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:.85rem;margin-bottom:1.5rem}
  .pill{padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:500;border:1px solid transparent}
  .updated-badge{display:inline-block;padding:3px 10px;border-radius:20px;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;font-size:.7rem;font-weight:500}

  /* KPI */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:1.5rem}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.85rem 1rem}
  .kpi-label{font-size:.68rem;color:var(--text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
  .kpi-val{font-size:1.55rem;font-weight:600;letter-spacing:-.03em;line-height:1}
  .kpi-sub{font-size:.68rem;color:var(--text-faint);margin-top:4px;font-family:'DM Mono',monospace}

  /* Sprint cards */
  .sprint-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:1.5rem}
  .sprint-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem}
  .sprint-card-title{font-size:.8rem;font-weight:600;margin-bottom:.75rem;display:flex;align-items:center;justify-content:space-between}
  .sprint-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:.78rem}
  .sprint-row:last-child{border-bottom:none}
  .sprint-name{color:var(--text-muted);font-weight:500}
  .sprint-sp{font-family:'DM Mono',monospace;font-weight:600}
  .sprint-desc{font-size:.69rem;color:var(--text-faint);margin-top:1px}

  /* Section */
  .divider{border:none;border-top:1px solid var(--border);margin:1.75rem 0}
  .section-header{display:flex;align-items:center;gap:10px;margin-bottom:1rem;padding-bottom:.55rem;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .section-title{font-size:.93rem;font-weight:600}
  .legend{display:flex;gap:12px;margin-left:auto;align-items:center;flex-wrap:wrap}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--text-muted)}
  .legend-dot{width:10px;height:10px;border-radius:2px}

  /* Chart */
  .chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:1.25rem}
  .chart-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .chart-row:last-child{margin-bottom:0}
  .chart-avatar{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:600;flex-shrink:0}
  .chart-name{font-size:.8rem;font-weight:500;color:var(--text);min-width:52px;text-align:right}
  .chart-bar-bg{flex:1;height:28px;background:#f3f4f6;border-radius:6px;overflow:hidden;display:flex}
  .chart-seg{height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:.68rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
  .chart-seg.omni{background:var(--omni)}
  .chart-seg.ai{background:var(--ai)}
  .chart-total{font-size:.75rem;font-weight:600;font-family:'DM Mono',monospace;min-width:40px;text-align:right}
  .chart-sep{font-size:.68rem;color:var(--text-faint);min-width:8px;text-align:center}
  .chart-avg{font-size:.75rem;font-weight:600;font-family:'DM Mono',monospace;min-width:52px;color:var(--text)}
  .chart-avg span{font-size:.62rem;font-weight:400;color:var(--text-faint)}

  /* Table */
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:1.25rem}
  table{width:100%;border-collapse:collapse;font-size:.82rem;table-layout:fixed}
  thead tr{background:#f8f8fc;border-bottom:1px solid var(--border-strong)}
  th{padding:10px 10px;text-align:right;font-size:.68rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;line-height:1.4}
  th.l{text-align:left}
  td{padding:10px 10px;text-align:right;border-bottom:1px solid var(--border);vertical-align:middle}
  td.l{text-align:left}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fafafa}
  tr.total-row td{background:#f8f8fc;font-weight:600;border-top:1.5px solid var(--border-strong);border-bottom:none}
  .avatar{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:600;margin-right:6px;vertical-align:middle;flex-shrink:0}
  .name-cell{display:flex;align-items:center}
  .mono{font-family:'DM Mono',monospace;font-weight:600}
  .pct{font-family:'DM Mono',monospace;font-size:.76rem;color:var(--text-muted)}
  .zero{color:var(--text-faint);font-family:'DM Mono',monospace}
  .note-tag{font-size:.7rem;color:var(--text-muted);line-height:1.4;max-width:150px}
  .note-warn{color:#ef4444;font-size:.67rem}

  /* Footer */
  .bottom-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:1rem}
  .bottom-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.85rem 1rem}
  .bottom-label{font-size:.7rem;color:var(--text-muted);font-weight:500;margin-bottom:5px;line-height:1.3}
  .bottom-val{font-size:1.45rem;font-weight:600;letter-spacing:-.03em;line-height:1}
  .bottom-sub{font-size:.67rem;color:var(--text-faint);margin-top:4px;line-height:1.4}
  .warn-box{background:var(--warn-bg);border:1px solid #fde68a;border-radius:6px;padding:.6rem 1rem;font-size:.75rem;color:var(--warn-text);margin-bottom:.75rem;line-height:1.5}
  .footnote{font-size:.67rem;color:var(--text-faint);line-height:1.9}
</style>
</head>
<body>

<div id="toolbar">
  <span class="tb-title">✏️ Edit mode</span>
  <button class="tb-btn tb-edit" onclick="enableEdit()">แก้ไขข้อความ</button>
  <button class="tb-btn tb-done" onclick="disableEdit()">✓ เสร็จแล้ว</button>
  <span class="tb-badge" id="badge">กำลังแก้ไข — คลิกที่ข้อความใดก็ได้</span>
  <span class="tb-hint" id="hint">คลิก "แก้ไขข้อความ" เพื่อแก้ได้เลย</span>
</div>

<div class="page" id="app"></div>

<script>
const DATA = {
  _updated: "2026-06-08",
  report_title: "Zimple Solution — Sprint Effort Summary",
  team: ["Q", "Wick", "Griang", "Tan", "Top", "Toy"],
  projects: [
    {
      id: "omni", name: "Zimple Omni", color: "#6C5CE7", color_light: "#EEF0FF",
      sprints: [
        { name: "Sprint 4", sp: 60, desc: "RBAC + Settings & Configuration", date_start: "16 Feb 26", date_end: "1 Mar 26" },
        { name: "Sprint 5", sp: 24, desc: "Login Security",                  date_start: "2 Mar 26",  date_end: "15 Mar 26" },
        { name: "Sprint 6", sp: 62, desc: "Login Security + SLA Management", date_start: "16 Mar 26", date_end: "29 Mar 26" }
      ]
    },
    {
      id: "ai", name: "Zimple AI", color: "#D63384", color_light: "#FCE8F3",
      sprints: [
        { name: "SP.1", sp: 26, desc: "Knowledge Ingestion + Program Setup",                     date_start: "5 May 26",  date_end: "18 May 26" },
        { name: "SP.2", sp: 34, desc: "Vault Injection + Auth + Sign Up + Login + Workspace",    date_start: "18 May 26", date_end: "6 Jun 26" }
      ]
    }
  ],
  members: [
    { name:"Wick",  avatar_bg:"#fce8f3", avatar_color:"#9d174d", note:"Split 2 projects",        note_warning:null,              sp_by_project:{ omni:16,    ai:56 } },
    { name:"Q",     avatar_bg:"#ede9fe", avatar_color:"#5b21b6", note:"Core dev Omni",            note_warning:null,              sp_by_project:{ omni:40.67, ai:1  } },
    { name:"Griang",avatar_bg:"#d1fae5", avatar_color:"#065f46", note:"Core dev Omni เท่านั้น",  note_warning:null,              sp_by_project:{ omni:40,    ai:0  } },
    { name:"Toy",   avatar_bg:"#fef3c7", avatar_color:"#92400e", note:"Core dev Omni",            note_warning:null,              sp_by_project:{ omni:34.67, ai:1  } },
    { name:"Top",   avatar_bg:"#dbeafe", avatar_color:"#1e40af", note:"Split กับ project นอก",   note_warning:"อาจออก full-time", sp_by_project:{ omni:9.67, ai:1  } },
    { name:"Tan",   avatar_bg:"#f3f4f6", avatar_color:"#374151", note:"Dev Lead — manage ทีม",   note_warning:null,              sp_by_project:{ omni:5,     ai:1  } }
  ],
  footnotes: [
    "tasks ที่มีหลาย owner: split SP เท่ากันทุกคน",
    "ตัวเลข SP ไม่รวม effort ในการแก้ defect — actual effort จริงของทีมอาจสูงกว่านี้"
  ]
};

const TOTAL_CYCLES = 3;

function render(d) {
  const pMap = {};
  d.projects.forEach(p => {
    const total = p.sprints.reduce((s,x) => s+x.sp, 0);
    pMap[p.id] = { ...p, total, avg: +(total/p.sprints.length).toFixed(2) };
  });
  const ids = d.projects.map(p => p.id);
  const grandTotal = Object.values(pMap).reduce((s,p) => s+p.total, 0);
  const totalSprints = d.projects.reduce((s,p) => s+p.sprints.length, 0);
  const combinedAvg = +(grandTotal/totalSprints).toFixed(2);
  const members = d.members.map(m => {
    const total = +ids.reduce((s,id) => s+(m.sp_by_project[id]||0), 0).toFixed(2);
    return {...m, total};
  });
  const maxTotal = Math.max(...members.map(m => m.total));

  const sprintRange = d.projects.map(p => `${p.name} (${p.sprints.map(s=>s.name).join(', ')})`).join(' & ');
  const legend = d.projects.map(p =>
    `<div class="legend-item"><div class="legend-dot" style="background:${p.color}"></div>${p.name}</div>`
  ).join('');

  // Pills
  const pills = [
    ...d.projects.map(p => `<span class="pill" style="background:${p.color_light};color:${p.color};border-color:${p.color}44">${p.name}</span>`),
    `<span class="pill" style="background:#fff7ed;color:#c2410c;border-color:#fed7aa">Zimple Ecom</span>`,
    `<span class="pill" style="background:#f0fdf4;color:#166534;border-color:#bbf7d0">Team: ${d.team.join(' · ')}</span>`
  ].join('');

  // KPI cards
  const kpis = [
    { label:'Total SP รวม', val:grandTotal, color:'', sub: d.projects.map(p=>`${p.name.replace('Zimple ','')} ${pMap[p.id].total}`).join(' + ') },
    ...d.projects.map(p => ({ label:`เฉลี่ย ${p.name.replace('Zimple ','')} / sprint`, val:pMap[p.id].avg, color:p.color, sub:`${pMap[p.id].total} ÷ ${p.sprints.length} sprints` })),
    { label:'เฉลี่ย Combined / sprint', val:combinedAvg, color:'', sub:`${grandTotal} ÷ ${totalSprints} sprints รวม` }
  ].map(k => `<div class="kpi-card"><div class="kpi-label">${k.label}</div><div class="kpi-val" style="color:${k.color||'var(--text)'}">${k.val}</div><div class="kpi-sub">${k.sub}</div></div>`).join('');

  // Sprint breakdown cards
  const sprintCards = d.projects.map(p => `
    <div class="sprint-card">
      <div class="sprint-card-title">
        <span style="color:${p.color}">${p.name}</span>
        <span style="font-size:.68rem;color:var(--text-faint);font-weight:400">${p.sprints.length} sprints · Total ${pMap[p.id].total} SP</span>
      </div>
      ${p.sprints.map(s => `
        <div class="sprint-row">
          <div>
            <div class="sprint-name">${s.name}${s.date_start&&s.date_end ? ` <span style="font-weight:400;color:var(--text-faint);font-size:.68rem">${s.date_start} – ${s.date_end}</span>` : ''}</div>
            <div class="sprint-desc">${s.desc}</div>
          </div>
          <div class="sprint-sp" style="color:${p.color}">${s.sp} SP</div>
        </div>`).join('')}
    </div>`).join('');

  // Chart: stacked + avg/sprint
  const sortedMembers = [...members].sort((a,b) => b.total - a.total);
  const chartRows = sortedMembers.map(m => {
    const omniSP = m.sp_by_project['omni'] || 0;
    const aiSP   = m.sp_by_project['ai']   || 0;
    const omniW  = maxTotal > 0 ? (omniSP / maxTotal * 100).toFixed(1) : 0;
    const aiW    = maxTotal > 0 ? (aiSP   / maxTotal * 100).toFixed(1) : 0;
    const avg    = +(m.total / TOTAL_CYCLES).toFixed(2);
    const omniLabel = omniSP > 5 ? `${omniSP}` : '';
    const aiLabel   = aiSP   > 5 ? `${aiSP}`   : '';
    return `
      <div class="chart-row">
        <div class="chart-avatar" style="background:${m.avatar_bg};color:${m.avatar_color}">${m.name.substring(0,2)}</div>
        <div class="chart-name">${m.name}</div>
        <div class="chart-bar-bg">
          ${omniSP > 0 ? `<div class="chart-seg omni" style="width:${omniW}%">${omniLabel}</div>` : ''}
          ${aiSP   > 0 ? `<div class="chart-seg ai"   style="width:${aiW}%">${aiLabel}</div>`   : ''}
        </div>
        <div class="chart-total">${m.total} SP</div>
        <div class="chart-sep">|</div>
        <div class="chart-avg">${avg} <span>SP/sp</span></div>
      </div>`;
  }).join('');

  // Table
  const thCols = d.projects.map(p =>
    `<th style="width:9%">${p.name.replace('Zimple ','')} SP<br><span style="font-weight:400;font-size:.62rem;text-transform:none">(${p.sprints.length}sp)</span></th>
     <th style="width:9%">เฉลี่ย<br>${p.name.replace('Zimple ','')}/sp</th>`
  ).join('');

  const rows = members.map(m => {
    const pct = +((m.total/grandTotal)*100).toFixed(1);
    const spCells = d.projects.map(p => {
      const sp = m.sp_by_project[p.id]||0;
      const avg = +(sp/p.sprints.length).toFixed(2);
      const cls = sp===0?'zero':'mono';
      const style = sp===0?'':` style="color:${p.color}"`;
      return `<td><span class="${cls}"${style}>${sp}</span></td><td><span class="${cls}"${style}>${avg}</span></td>`;
    }).join('');
    const noteHtml = m.note_warning ? `${m.note}<br><span class="note-warn">${m.note_warning}</span>` : m.note;
    return `<tr>
      <td class="l"><div class="name-cell"><div class="avatar" style="background:${m.avatar_bg};color:${m.avatar_color}">${m.name.substring(0,2)}</div>${m.name}</div></td>
      ${spCells}
      <td><span class="mono">${m.total}</span></td>
      <td><span class="pct">${pct}%</span></td>
      <td class="l"><div class="note-tag">${noteHtml}</div></td>
    </tr>`;
  }).join('');

  const totalCells = d.projects.map(p =>
    `<td><span class="mono" style="color:${p.color}">${pMap[p.id].total}</span></td>
     <td><span class="mono" style="color:${p.color}">${pMap[p.id].avg}</span></td>`
  ).join('');

  // Bottom cards
  const bottomCards = [
    ...d.projects.map(p => {
      const top3 = members.filter(m=>(m.sp_by_project[p.id]||0)>5).sort((a,b)=>(b.sp_by_project[p.id]||0)-(a.sp_by_project[p.id]||0)).slice(0,3).map(m=>m.name).join('+');
      return { label:`เฉลี่ย ${p.name.replace('Zimple ','')} / sprint`, val:`${pMap[p.id].avg} SP`, color:p.color, sub:top3?`core dev: ${top3}`:'' };
    }),
    { label:'เฉลี่ยรวมทั้ง 2 projects / sprint', val:`${combinedAvg} SP`, color:'', sub:`${grandTotal} ÷ ${totalSprints} sprints รวม` }
  ].map(c => `<div class="bottom-card"><div class="bottom-label">${c.label}</div><div class="bottom-val" style="color:${c.color||'var(--text)'}">${c.val}</div>${c.sub?`<div class="bottom-sub">${c.sub}</div>`:''}</div>`).join('');

  document.getElementById('app').innerHTML = `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:.4rem">
      <div>
        <div class="title">Zimple <span>Solution</span> — Sprint Effort Summary</div>
        <div class="subtitle">${sprintRange} &nbsp;·&nbsp; Dev Team: ${d.team.length} คน</div>
      </div>
      <span class="updated-badge">อัปเดต ${d._updated}</span>
    </div>
    <div class="pills">${pills}</div>
    <div class="kpi-grid">${kpis}</div>
    <div class="sprint-grid">${sprintCards}</div>
    <hr class="divider">
    <div class="section-header">
      <div class="section-title">Workload รายคน</div>
      <div class="legend">${legend}<span style="font-size:.67rem;color:var(--text-faint);margin-left:4px">| SP รวม และเฉลี่ย/sprint (÷ ${TOTAL_CYCLES} cycles)</span></div>
    </div>
    <div class="chart-wrap">${chartRows}</div>
    <div class="section-header">
      <div class="section-title">SP Allocation รายคน — ตารางละเอียด</div>
      <div class="legend">${legend}<span style="font-size:.67rem;color:var(--text-faint);margin-left:4px">| เฉลี่ย/sprint คำนวณแยกตาม sprint จริง</span></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th class="l" style="width:13%">คน</th>
          ${thCols}
          <th style="width:8%">รวม SP</th>
          <th style="width:8%">% of ${grandTotal}</th>
          <th class="l" style="width:18%">หมายเหตุ</th>
        </tr></thead>
        <tbody>
          ${rows}
          <tr class="total-row">
            <td class="l" style="color:var(--text-muted)">รวม</td>
            ${totalCells}
            <td><span class="mono">${grandTotal}</span></td>
            <td><span class="pct">100%</span></td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="bottom-grid">${bottomCards}</div>
    <div class="warn-box">⚠ ตัวเลข SP ข้างต้นไม่รวม effort ในการแก้ defect — actual effort จริงของทีมอาจสูงกว่านี้</div>
    <div class="footnote">${d.footnotes.map(f=>'* '+f).join('<br>')}</div>
  `;
  document.title = d.report_title + ' — ' + d._updated;
}

function enableEdit() {
  document.querySelectorAll('#app *').forEach(el => {
    if (el.children.length === 0 && el.textContent.trim()) {
      el.setAttribute('contenteditable','true');
      el.setAttribute('spellcheck','false');
    }
  });
  document.querySelector('.tb-edit').style.display = 'none';
  document.querySelector('.tb-done').style.display = 'inline-block';
  document.getElementById('badge').style.display = 'inline-block';
  document.getElementById('hint').style.display = 'none';
}

function disableEdit() {
  document.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
  document.querySelector('.tb-edit').style.display = 'inline-block';
  document.querySelector('.tb-done').style.display = 'none';
  document.getElementById('badge').style.display = 'none';
  document.getElementById('hint').style.display = 'inline';
  document.getElementById('hint').textContent = '✓ บันทึกแล้ว — กดแก้ไขต่อได้เลย';
}

render(DATA);
</script>
